<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>QuickDL — Watch Ad</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#000;color:#fff}
    body{display:flex;align-items:center;justify-content:center}
    .card{width:min(92%,520px);box-sizing:border-box;background:#121212;padding:24px 20px;border-radius:22px;text-align:center}
    .icon{font-size:46px}
    .muted{opacity:.78;line-height:1.45}
    button{width:100%;padding:15px;border:0;border-radius:14px;margin-top:12px;font-size:17px;font-weight:700;background:#168cff;color:#fff}
    button.secondary{background:#26313c}
    #skip{display:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📢</div>
    <h2>Preparing your ad…</h2>
    <p class="muted">The ad starts automatically. When it finishes, your download continues in Telegram.</p>
    <div id="status" class="muted">Loading…</div>
    <button id="retry" type="button" style="display:none">Try again</button>
    <button id="skip" class="secondary" type="button">Skip</button>
  </div>
  <script>
  (function(){
    const tg=window.Telegram&&Telegram.WebApp;
    if(tg){tg.ready();tg.expand();}
    const status=document.getElementById("status");
    const retry=document.getElementById("retry");
    const skip=document.getElementById("skip");

    // This standalone template is intentionally a safe fallback page. The live
    // per-request page is generated by bot.py with the real Monetag zone/token.
    status.textContent="Open this page from the Watch ad button in Telegram.";
    retry.style.display="none";
    skip.style.display="none";
  })();
  </script>
</body>
</html>
