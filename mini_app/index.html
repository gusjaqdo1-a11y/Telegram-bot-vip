<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>QuickDL • Watch Ad</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{color-scheme:light dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,system-ui,sans-serif;background:var(--tg-theme-bg-color,#eef1f4);color:var(--tg-theme-text-color,#111);display:flex;align-items:stretch;justify-content:center}
    .page{width:100%;max-width:720px;min-height:100vh;padding:18px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
    .card{margin:auto 0;background:var(--tg-theme-secondary-bg-color,#fff);border-radius:22px;padding:22px 18px 18px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .brand{font-weight:800;font-size:24px;text-align:center;margin:0 0 6px}
    .sub{opacity:.7;text-align:center;margin:0 0 18px}
    .adbox{min-height:290px;border-radius:18px;background:rgba(127,127,127,.12);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:22px;text-align:center}
    .adlabel{font-size:13px;opacity:.6}
    .adtitle{font-size:22px;font-weight:800}
    .adcta{width:100%;border:0;border-radius:15px;padding:15px 16px;font-size:17px;font-weight:800;background:#198cff;color:#fff}
    .timer{font-size:44px;font-weight:900;text-align:center;margin:18px 0 12px}
    .continue{width:100%;border:0;border-radius:15px;padding:16px;font-size:18px;font-weight:900;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}
    .continue:disabled{opacity:.45}
    .note{text-align:center;font-size:12px;opacity:.6;margin:12px 0 0;line-height:1.4}
    .ok{display:none;font-weight:800;text-align:center;margin:8px 0 0}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1 class="brand">QuickDL</h1>
      <p class="sub">Watch the ad to continue your download</p>
      <div class="adbox">
        <div class="adlabel">ads by Adsterra</div>
        <div class="adtitle">Click to get the reward!</div>
        <button class="adcta" id="adButton">↘ Open Ad</button>
      </div>
      <div class="timer" id="timer">__AD_GATE_SECONDS__</div>
      <button class="continue" id="continue" disabled>Continue</button>
      <div class="ok" id="ok">✓ Ready — continuing…</div>
      <p class="note">Keep this Mini App open and return after the ad opens.</p>
    </section>
  </main>
<script>
(() => {
  const tg=window.Telegram && window.Telegram.WebApp;
  if(!tg){document.getElementById('timer').textContent='Telegram only';return;}
  tg.ready(); tg.expand();
  const token='__TOKEN__';
  const initData=tg.initData || '';
  const timer=document.getElementById('timer');
  const adButton=document.getElementById('adButton');
  const cont=document.getElementById('continue');
  const ok=document.getElementById('ok');
  const adUrl='__AD_SMARTLINK_URL__';
  let remaining=Number('__AD_GATE_SECONDS__')||5;
  let adOpened=false;
  let ready=false;
  let ticking=null;

  function setTimer(n){remaining=Math.max(0,Math.ceil(n));timer.textContent=remaining>0?remaining:'✓';}

  async function session(){
    const r=await fetch('/ad/api/session/'+encodeURIComponent(token),{
      method:'POST',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},
      body:JSON.stringify({initData})
    });
    const d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||'Session failed');
    remaining=Number(d.seconds)||0; setTimer(remaining);
    if(remaining<=0 && adOpened) enableContinue();
    return d;
  }

  function enableContinue(){ready=true;cont.disabled=false;ok.style.display='block';setTimer(0);}

  function startCountdown(seconds){
    clearInterval(ticking); remaining=seconds; setTimer(remaining);
    ticking=setInterval(()=>{
      remaining--; setTimer(remaining);
      if(remaining<=0){clearInterval(ticking); if(adOpened) enableContinue();}
    },1000);
  }

  adButton.addEventListener('click',()=>{
    adOpened=true;
    try{tg.openLink(adUrl,{try_instant_view:false});}
    catch(_){window.open(adUrl,'_blank','noopener');}
    if(remaining<=0) enableContinue(); else startCountdown(remaining);
  });

  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState==='visible' && adOpened){
      try{
        const d=await session();
        if(d.seconds<=0) enableContinue(); else if(!ticking) startCountdown(d.seconds);
      }catch(e){console.error(e);}
    }
  });

  cont.addEventListener('click',async()=>{
    if(!ready) return;
    cont.disabled=true; cont.textContent='Please wait…';
    try{
      const r=await fetch('/ad/api/complete/'+encodeURIComponent(token),{
        method:'POST',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},
        body:JSON.stringify({initData})
      });
      const d=await r.json();
      if(!r.ok||!d.ok) throw new Error(d.error||'Could not complete ad');
      ok.textContent='✓ Download is starting…';
      ok.style.display='block';
      setTimeout(()=>tg.close(),250);
    }catch(e){
      console.error(e); cont.disabled=false; cont.textContent='Continue';
      ok.textContent=e.message||'Please try again'; ok.style.display='block';
    }
  });

  session().catch(e=>{timer.textContent='Error';console.error(e);});
})();
</script>
</body>
</html>
